databaseChangeLog:
  - changeSet:
      id: create-offers
      author: Ragib
      changes:
        - createTable:
            tableName: offers
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: term
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: interest
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: accepted
                  type: boolean
              - column:
                  name: credit_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
  - changeSet:
      id: create-offers1
      author: Ragib
      changes:
        - addForeignKeyConstraint:
            baseTableName: offers
            baseColumnNames: credit_id
            referencedTableName: credits
            referencedColumnNames: id
            constraintName: fk_offers_credits



